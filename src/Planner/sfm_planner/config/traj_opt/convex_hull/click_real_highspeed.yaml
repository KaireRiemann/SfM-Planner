# Stable convex-hull profile for ordinary state2state corridor planning.
#
# This file is loaded only when:
#   traj_opt/exp_traj/convex_hull_en: true
# and is intentionally independent of the dense integral penalty set in
# click_real_highspeed.yaml. Bezier/MINVO may still be selected with `basis`.

convex_hull:
  # 0: Bezier, 1: MINVO. Stable route: fixed depth-2 V2.
  basis: 0
  flatness_en: true
  position_scale: 0.25
  robust_certificate_margin: 0.05

  # Continuous P/V/A and flatness-envelope certificates are read-only on the
  # stable route. Certificate-triggered polish remains experimental.
  require_certification: false
  polish:
    initial_penalty: 3.0e+5
    penalty_growth: 5.0
    progress_ratio: 0.5
    top_k: 32
    max_constraints: 64
    max_outer: 3
    inner_tol_init: 1.0e-2
    inner_tol_final: 1.0e-4
    append_en: true
    multiplier_reuse_en: true

  # Convex control-point costs and dense quadrature costs have different
  # residual normalization and cardinality. Never tune these values by editing
  # the dense penna_* block in the main planner YAML.
  penalty:
    penna_scale: -1.0
    penna_t: 2.0e+5
    penna_ts: -1.0
    penna_pos: 5.0e+7
    penna_vel: 1.0e+7
    penna_acc: 1.0e+7
    # <= 0 disables both the jerk cost and continuous jerk certificate.
    penna_jerk: -1.0e+5
    penna_attract: 1.0e+3
    penna_guide_path: 0.0
    penna_guide_vel: -1.0
    penna_guide_z_tube: 1.0e+7
    penna_omg: 5.0e+6
    penna_theta: -1.0
    penna_thr: 2.0e+6
